asyncapi: 3.0.0
info:
  title: Iloggning Async API
  version: 0.1.0
  description: Iloggning Async API för att logga vilken information som visas för en handläggare när en regel öppnas

channels:
  iloggning.uppgiftsaccess:
    messages:
      UppgiftsaccessMessage:
        $ref: '#/components/messages/UppgiftsaccessMessage'

operations:
  UppgiftsaccessMessage:
    action: receive
    channel:
      $ref: '#/channels/iloggning.uppgiftsaccess'
    messages:
      - $ref: '#/channels/iloggning.uppgiftsaccess/messages/UppgiftsaccessMessage'
    summary: Konsumerar event varje gång en handläggare öppnar en regel och får information visad

components:
  messages:
    UppgiftsaccessMessage:
      payload:
        $ref: '#/components/schemas/UppgiftsaccessMessage'
      examples:
        - payload:
            handlaggare:
              typId: "9b1e4f2a-6c3d-4e8b-a7f5-2d0c1b9e8a36"
              varde: "H123456"
            tidpunkt: "2026-09-30T08:35:40+02:00"
            handlaggningId: "3f1c2a9e-7b4d-4e2a-9c1f-5a6b7c8d9e0f"
            uppgiftId: "8a2b3c4d-5e6f-4a1b-8c2d-3e4f5a6b7c8d"
            regel: rtf-manuell
            individer:
              - typId: "4c34906c-03d9-425f-9a1a-062ef6eb88c7"
                varde: "19901010-1234"

  schemas:
    UppgiftsaccessMessage:
      type: object
      title: UppgiftsaccessMessage
      required:
        - handlaggare
        - tidpunkt
        - handlaggningId
        - uppgiftId
        - regel
        - individer
      properties:
        handlaggare:
          $ref: '#/components/schemas/Idtyp'
          description: Handläggaren som fick informationen visad
        tidpunkt:
          type: string
          format: date-time
          description: Tidpunkt då informationen visades
        handlaggningId:
          type: string
          format: uuid
          description: Unikt ID som identifierar handläggningsärendet
        uppgiftId:
          type: string
          format: uuid
          description: Unikt ID som identifierar uppgiften som öppnades
        regel:
          type: string
          description: Namnet på regeln vars information visades
          example: rtf-manuell
        individer:
          type: array
          description: Individerna vars information visades. Innehåller personuppgifter.
          minItems: 1
          items:
            $ref: '#/components/schemas/Idtyp'

    Idtyp:
      type: object
      title: Idtyp
      required:
        - typId
        - varde
      properties:
        typId:
          type: string
          description: Unikt ID som identifierar vilken typ av värde som anges
        varde:
          type: string
          description: ID-värde som identifieras av typ
      example:
        typId: "4c34906c-03d9-425f-9a1a-062ef6eb88c7"
        varde: "19901010-1234"
